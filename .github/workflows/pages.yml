# Publica a pasta site/ no GitHub Pages.
#
# O deploy é por Actions, e não por "branch e pasta", porque o Pages nativo só serve
# a raiz ou /docs -- e mover o site para /docs misturaria a página com a documentação
# do projeto. Aqui a pasta site/ é publicada como está: ela já é estática.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se houver push durante um deploy, o novo espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
